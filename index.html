
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100d24">
<title>RIFAT FF PANEL SELLER</title>

<style>
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Login - FF Panel Store</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0b081a;
      background-image: radial-gradient(circle at top, #1e1340 0%, #0b081a 70%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: rgba(21, 16, 42, 0.85);
      border: 1px solid #34294f;
      border-radius: 20px;
      padding: 30px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(10px);
    }

    .header-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .title {
      color: #a78bfa;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #a39bbe;
      font-size: 13px;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #c4b5fd;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 13px 40px 13px 14px;
      background: #150f2e;
      color: #ffffff;
      border: 1px solid #493b69;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      font-size: 16px;
      user-select: none;
      opacity: 0.7;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 20px;
    }

    .link {
      color: #a78bfa;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .footer-text {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #a39bbe;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header-area">
      <span class="logo-icon">🔥</span>
      <h1 class="title">FF PANEL STORE</h1>
      <p class="subtitle">সদস্য লগইন</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); alert('সাইন ইন সম্পন্ন হচ্ছে...');">
      <div class="form-group">
        <label for="email">ইমেল বা জিমেইল</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="আপনার ইমেল লিখুন" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">পাসওয়ার্ড</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required />
          <span class="toggle-password" onclick="togglePass()">👁️</span>
        </div>
      </div>

      <div class="forgot-pass">
        <a href="#" class="link">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>

      <button type="submit" class="submit-btn">সাইন ইন</button>
    </form>

    <div class="footer-text">
      নতুন অ্যাকাউন্ট লাগবে? <a href="#" class="link">সাইন আপ করুন</a>
    </div>
  </div>

  <script>
    function togglePass() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }
  </script>

</body>
</html>
