<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifat Panel Seller - Portal</title>
  
  <!-- eSports & Professional Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090614;
      background-image: radial-gradient(circle at top, #1e103a 0%, #090614 75%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
    }

    .app-card {
      background: rgba(18, 12, 36, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 30px 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(16px);
    }

    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Fallback/Safe Logo Container */
    .brand-logo-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 10px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      border: 2px solid rgba(234, 179, 8, 0.6);
      background: #110b27;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .auth-tabs {
      display: flex;
      background: #110b27;
      border: 1px solid #332554;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000000;
      box-shadow: 0 2px 10px rgba(234, 179, 8, 0.3);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 12px;
      color: #cbd5e1;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 11px 38px 11px 14px;
      background: #110b27;
      color: #ffffff;
      border: 1.5px solid #332554;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
      font-family: 'Hind Siliguri', sans-serif;
      font-weight: 500;
    }

    input:focus {
      border-color: #eab308;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
      background: #160e33;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: #cbd5e1;
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 16px;
    }

    .link {
      font-family: 'Hind Siliguri', sans-serif;
      color: #facc15;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
      border-radius: 12px;
      color: #000000;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
      margin-top: 4px;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #332554;
      padding-bottom: 12px;
    }

    .user-welcome h3 {
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
    }

    .user-welcome p {
      font-size: 12px;
      color: #94a3b8;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-card-item {
      background: #110b27;
      border: 1px solid #332554;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-info h4 {
      font-size: 15px;
      color: #ffffff;
      font-weight: 700;
    }

    .panel-info span {
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
    }

    .buy-btn {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- 1. AUTHENTICATION VIEW -->
    <div id="authView" class="view-section active">
      <div class="header-area">
        <div class="brand-logo-container">
          <img src="file_000000007dac82118992c526a33fae9b.png" alt="Logo" onerror="this.style.display='none'">
        </div>
        <h1 class="brand-title">Rifat Panel Seller</h1>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" id="signInTabBtn" onclick="switchAuthTab('signin')">সাইন ইন</button>
        <button class="tab-btn" id="signUpTabBtn" onclick="switchAuthTab('signup')">সাইন আপ</button>
      </div>

      <!-- Sign In Form -->
      <div id="signinForm" class="view-section active" style="display: block;">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>ইমেল বা জিমেইল</label>
            <div class="input-wrapper">
              <input type="email" placeholder="আপনার ইমেল টাইপ করুন" required />
            </div>
          </div>

          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="signin-password" placeholder="পাসওয়ার্ড দিন" required />
              <span class="toggle-password" onclick="togglePass('signin-password')">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-1
