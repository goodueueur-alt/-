<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifat FF Panel Seller - Login</title>
  
  <!-- eSports & Professional Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090614;
      background-image: radial-gradient(circle at top, #1e103a 0%, #090614 75%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
    }

    .login-card {
      background: rgba(18, 12, 36, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 35px 28px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(16px);
    }

    .header-area {
      text-align: center;
      margin-bottom: 25px;
    }

    /* Custom Logo Image Container */
    .brand-logo-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 14px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      border: 2px solid rgba(234, 179, 8, 0.6);
      background: #110b27;
    }

    .brand-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Custom eSports Brand Font Title */
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .subtitle {
      font-family: 'Hind Siliguri', sans-serif;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 13px 40px 13px 14px;
      background: #110b27;
      color: #ffffff;
      border: 1.5px solid #332554;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
      font-family: 'Hind Siliguri', sans-serif;
      font-weight: 500;
    }

    input:focus {
      border-color: #eab308;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
      background: #160e33;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: 0.2s;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: #cbd5e1;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 20px;
    }

    .link {
      font-family: 'Hind Siliguri', sans-serif;
      color: #facc15;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .link:hover {
      color: #fef08a;
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
      border-radius: 12px;
      color: #000000;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 13px;
      color: #94a3b8;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="header-area">
      <!-- আপনার গেমিং লোগো ইমেজ -->
      <div class="brand-logo-container">
        <img src="file_000000007dac82118992c526a33fae9b.png" alt="Rifat Panel Seller Logo">
      </div>

      <!-- ব্র্যান্ড নাম -->
      <h1 class="brand-title">Rifat Panel Seller</h1>
      <p class="subtitle">মেম্বার লগইন পোর্টাল</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); alert('লগইন প্রসেস হচ্ছে...');">
      <div class="form-group">
        <label for="email">ইমেল বা জিমেইল</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="আপনার ইমেল টাইপ করুন" required />
        </div>
      </div>

      <div class="form-group">
        <label for="password">পাসওয়ার্ড</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" required />
          <span class="toggle-password" onclick="togglePass()">
            <svg viewBox="0 0 24 24">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </span>
        </div>
      </div>

      <div class="forgot-pass">
        <a href="#" class="link">পাসওয়ার্ড ভুলে গেছেন?</a>
      </div>

      <button type="submit" class="submit-btn">সাইন ইন</button>
    </form>

    <div class="footer-text">
      নতুন অ্যাকাউন্ট লাগবে? <a href="#" class="link">সাইন আপ করুন</a>
    </div>
  </div>

  <script>
    function togglePass() {
      const passInput = document.getElementById('password');
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }
  </script>

</body>
</html>
