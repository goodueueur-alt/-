<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifat Panel Seller - Portal</title>
  
  <!-- eSports & Professional Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
  
  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090614;
      background-image: radial-gradient(circle at top, #1e103a 0%, #090614 75%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
    }

    .app-card {
      background: rgba(18, 12, 36, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 30px 24px;
      width: 100%;
      max-width: 410px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(16px);
    }

    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Logo Container */
    .brand-logo-container {
      width: 85px;
      height: 85px;
      margin: 0 auto 10px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      border: 2px solid rgba(234, 179, 8, 0.6);
      background: #110b27;
    }

    .brand-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    /* Tabs Bar */
    .auth-tabs {
      display: flex;
      background: #110b27;
      border: 1px solid #332554;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000000;
      box-shadow: 0 2px 10px rgba(234, 179, 8, 0.3);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      background: #110b27;
      color: #ffffff;
      border: 1.5px solid #332554;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
      font-family: 'Hind Siliguri', sans-serif;
      font-weight: 500;
    }

    input:focus {
      border-color: #eab308;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
      background: #160e33;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: #cbd5e1;
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 18px;
    }

    .link {
      font-family: 'Hind Siliguri', sans-serif;
      color: #facc15;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
      border-radius: 12px;
      color: #000000;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
      margin-top: 5px;
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
    }

    .otp-btn {
      background: #332554;
      color: #facc15;
      border: 1px solid #facc15;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
      transition: 0.2s;
    }

    .otp-btn:hover {
      background: #facc15;
      color: #000;
    }

    .view-block {
      display: block;
    }

    .view-hidden {
      display: none !important;
    }

    /* Dashboard Styles */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #332554;
      padding-bottom: 12px;
    }

    .user-welcome h3 {
      font-size: 16px;
      font-weight: 700;
      color: #facc15;
    }

    .user-welcome p {
      font-size: 12px;
      color: #94a3b8;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-card-item {
      background: #110b27;
      border: 1px solid #332554;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-info h4 {
      font-size: 15px;
      color: #ffffff;
      font-weight: 700;
    }

    .panel-info span {
      font-size: 12px;
      color: #10b981;
      font-weight: 600;
    }

    .buy-btn {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-card">
    
    <!-- AUTHENTICATION SECTION -->
    <div id="authSection" class="view-block">
      <div class="header-area">
        <div class="brand-logo-container">
          <img src="file_000000007dac82118992c526a33fae9b.png" alt="Logo">
        </div>
        <h1 class="brand-title">Rifat Panel Seller</h1>
      </div>

      <!-- Tab Buttons -->
      <div class="auth-tabs" id="tabsBar">
        <button class="tab-btn active" id="btnTabSignin" onclick="showForm('signin')">সাইন ইন</button>
        <button class="tab-btn" id="btnTabSignup" onclick="showForm('signup')">সাইন আপ</button>
      </div>

      <!-- Sign In Form -->
      <div id="signinBox" class="view-block">
        <form onsubmit="onLoginSubmit(event)">
          <div class="form-group">
            <label>ইমেল বা জিমেইল</label>
            <div class="input-wrapper">
              <input type="email" placeholder="আপনার ইমেল টাইপ করুন" required />
            </div>
          </div>

          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="signin-pass-input" placeholder="পাসওয়ার্ড দিন" required />
              <span class="toggle-password" onclick="togglePassField('signin-pass-input')">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </span>
            </div>
          </div>

          <div class="forgot-pass">
            <a href="#" class="link" onclick="showForm('forgot')">পাসওয়ার্ড ভুলে গেছেন?</a>
          </div>

          <button type="submit" class="submit-btn">সাইন ইন</button>
        </form>
      </div>

      <!-- Sign Up Form -->
      <div id="signupBox" class="view-hidden">
        <form onsubmit="onRegisterSubmit(event)">
          <div class="form-group">
            <label>সম্পূর্ণ নাম</label>
            <div class="input-wrapper">
              <input type="text" placeholder="আপনার পূর্ণ নাম লিখুন" required />
            </div>
          </div>

          <div class="form-group">
            <label>ইউজারনেম / ইন-গেম নাম</label>
            <div class="input-wrapper">
              <input type="text" placeholder="আপনার গেমিং নাম" required />
            </div>
          </div>

          <div class="form-group">
            <label>ইমেল বা জিমেইল</label>
            <div class="input-wrapper">
              <input type="email" placeholder="আপনার ইমেল টাইপ করুন" required />
            </div>
          </div>

          <div class="form-group">
            <label>হোয়াটসঅ্যাপ বা ফোন নম্বর</label>
            <div class="input-wrapper">
              <input type="tel" placeholder="আপনার নম্বর দিন" required />
            </div>
          </div>

          <div class="form-group">
            <label>পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="signup-pass-input" placeholder="পাসওয়ার্ড দিন" required />
              <span class="toggle-password" onclick="togglePassField('signup-pass-input')">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </span>
            </div>
          </div>

          <button type="submit" class="submit-btn">সাইন আপ</button>
        </form>
      </div>

      <!-- Forgot Password / OTP Reset Form -->
      <div id="forgotBox" class="view-hidden">
        <form onsubmit="onResetPasswordSubmit(event)">
          <p style="font-size: 13px; color: #94a3b8; margin-bottom: 14px; text-align: center;">আপনার জিমেইল দিন, ওটিপি পাঠান এবং রিসেট করুন</p>
          
          <div class="form-group">
            <label>জিমেইল বা ইমেল অ্যাড্রেস</label>
            <div class="input-wrapper">
              <input type="email" id="reset-email-input" placeholder="আপনার জিমেইল লিখুন" required />
            </div>
            <button type="button" class="otp-btn" onclick="sendOTPCode()">ওটিপি কোড পাঠান</button>
          </div>

          <div class="form-group">
            <label>ওটিপি (OTP কোড)</label>
            <div class="input-wrapper">
              <input type="text" id="otp-input" placeholder="জিমেইলে আসা ৬ ডিজিটের ওটিপি লিখুন" required />
            </div>
          </div>

          <div class="form-group">
            <label>নতুন পাসওয়ার্ড</label>
            <div class="input-wrapper">
              <input type="password" id="new-pass-input" placeholder="নতুন পাসওয়ার্ড দিন" required />
            </div>
          </div>

          <div class="form-group">
            <label>পাসওয়ার্ড নিশ্চিত করুন</label>
            <div class="input-wrapper">
              <input type="password" id="confirm-pass-input" placeholder="পুনরায় নতুন পাসওয়ার্ড দিন" required />
            </div>
          </div>

          <button type="submit" class="submit-btn">পাসওয়ার্ড রিসেট করুন</button>
          
          <div style="text-align: center; margin-top: 15px;">
            <a href="#" class="link" onclick="showForm('signin')">← আবার লগইন পেজে ফিরে যান</a>
          </div>
        </form>
      </div>

    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection" class="view-hidden">
      <div class="dashboard-header">
        <div class="user-welcome">
          <h3>স্বাগতম, Rifat!</h3>
          <p>স্ট্যাটাস: <span style="color: #10b981;">VIP Member</span></p>
        </div>
        <button class="logout-btn" onclick="logoutUser()">লগআউট</button>
      </div>

      <div>
        <p style="font-size: 14px; color: #cbd5e1; font-weight: 600; margin-bottom: 12px;">আমাদের প্রিমিয়াম প্যানেলসমূহ:</p>
        
        <div class="panel-card-item">
          <div class="panel-info">
            <h4>FF VIP Aimbot Panel</h4>
            <span>স্ট্যাটাস: সক্রিয় (Safe)</span>
          </div>
          <button class="buy-btn" onclick="alert('অর্ডার সফল হয়েছে!')">কিনুন</button>
        </div>

        <div class="panel-card-item">
          <div class="panel-info">
            <h4>FF Max Location Tool</h4>
            <span>স্ট্যাটাস: সক্রিয় (Safe)</span>
          </div>
          <button class="buy-btn" onclick="alert('অর্ডার সফল হয়েছে!')">কিনুন</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // EmailJS Initialisation with Public Key
    (function(){
       emailjs.init("YKCEjv8TUbgGmlnEX");
    })();

    let generatedOTP = "";

    function showForm(formType) {
      const signinBox = document.getElementById('signinBox');
      const signupBox = document.getElementById('signupBox');
      const forgotBox = document.getElementById('forgotBox');
      const btnTabSignin = document.getElementById('btnTabSignin');
      const btnTabSignup = document.getElementById('btnTabSignup');
      const tabsBar = document.getElementById('tabsBar');

      if (formType === 'signin') {
        signinBox.className = 'view-block';
        signupBox.className = 'view-hidden';
        forgotBox.className = 'view-hidden';
        tabsBar.style.display = 'flex';
        btnTabSignin.classList.add('active');
        btnTabSignup.classList.remove('active');
      } else if (formType === 'signup') {
        signinBox.className = 'view-hidden';
        signupBox.className = 'view-block';
        forgotBox.className = 'view-hidden';
        tabsBar.style.display = 'flex';
        btnTabSignup.classList.add('active');
        btnTabSignin.classList.remove('active');
      } else if (formType === 'forgot') {
        signinBox.className = 'view-hidden';
        signupBox.className = 'view-hidden';
        forgotBox.className = 'view-block';
        tabsBar.style.display = 'none';
      }
    }

    function togglePassField(fieldId) {
      const input = document.getElementById(fieldId);
      if (input) {
        input.type = input.type === 'password' ? 'text' : 'password';
      }
    }

    function onLoginSubmit(e) {
      e.preventDefault();
      document.getElementById('authSection').className = 'view-hidden';
      document.getElementById('dashboardSection').className = 'view-block';
    }

    function onRegisterSubmit(e) {
      e.preventDefault();
      alert('সফলভাবে অ্যাকাউন্ট তৈরি হয়েছে!');
      document.getElementById('authSection').className = 'view-hidden';
      document.getElementById('dashboardSection').className = 'view-block';
    }

    // Send OTP via EmailJS (Updated with broader parameter mapping)
    function sendOTPCode() {
      const emailField = document.getElementById('reset-email-input').value;
      if (!emailField) {
        alert('দয়া করে প্রথমে আপনার জিমেইল বা ইমেল লিখুন!');
        return;
      }

      // Generate a random 6-digit OTP
      generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

      const templateParams = {
        to_email: emailField,
        email: emailField,
        passcode: generatedOTP,
        otp: generatedOTP
      };

      alert('ওটিপি পাঠানো হচ্ছে, অনুগ্রহ করে একটু অপেক্ষা করুন...');

      emailjs.send("service_u36uj8r", "template_aimy5cj", templateParams)
        .then(function(response) {
            alert('ওটিপি সফলভাবে আপনার জিমেইলে পাঠানো হয়েছে!');
        }, function(error) {
            console.error('FAILED...', error);
            alert('ব্যর্থ হয়েছে: ' + JSON.stringify(error));
        });
    }

    function onResetPasswordSubmit(e) {
      e.preventDefault();
      const resetEmail = document.getElementById('reset-email-input').value;
      const enteredOTP = document.getElementById('otp-input').value;
      const newPass = document.getElementById('new-pass-input').value;
      const confirmPass = document.getElementById('confirm-pass-input').value;

      if (enteredOTP !== generatedOTP) {
        alert('ভুল ওটিপি কোড! সঠিক ওটিপি দিন।');
        return;
      }

      if (newPass !== confirmPass) {
        alert('নতুন পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!');
        return;
      }

      alert(resetEmail + ' জিমেইলের ওটিপি যাচাই সফল হয়েছে এবং পাসওয়ার্ড সফলভাবে রিসেট করা হয়েছে!');
      showForm('signin');
    }

    function logoutUser() {
      document.getElementById('dashboardSection').className = 'view-hidden';
      document.getElementById('authSection').className = 'view-block';
      showForm('signin');
    }
  </script>

</body>
</html>
