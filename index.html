<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIFAT FF PANEL SELLER</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #090b18;
      color: white;
    }

    .container {
      max-width: 400px;
      margin: 30px auto;
      padding: 24px;
      background: #15182b;
      border: 1px solid #6c4cff;
      border-radius: 16px;
      box-shadow: 0 0 20px #34216b;
    }

    h2, p {
      text-align: center;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      font-size: 15px;
    }

    input {
      color: white;
      background: #090b18;
      border: 1px solid #414765;
    }

    button {
      cursor: pointer;
      border: none;
      background: #7548ff;
      color: white;
      font-weight: bold;
    }

    .secondary {
      background: #252a43;
      border: 1px solid #7548ff;
    }

    .hidden {
      display: none;
    }

    .panel {
      padding: 15px;
      margin: 15px 0;
      background: #20243b;
      border-radius: 12px;
      text-align: center;
    }

    .panel img {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 8px;
    }

    .message {
      color: #80ffd0;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->
  <section class="container" id="loginPage">
    <h2>RIFAT FF PANEL SELLER</h2>
    <p>Member Login</p>

    <form id="loginForm">
      <input id="loginUsername" placeholder="Username" required>
      <input id="loginPassword" type="password"
             placeholder="Password" required>
      <button type="submit">Submit / Login</button>
    </form>

    <button class="secondary" onclick="showSignup()">
      Sign Up
    </button>

    <button class="secondary" onclick="showOwner()">
      Owner Option
    </button>

    <p id="loginMessage" class="message"></p>
  </section>

  <!-- SIGN UP PAGE -->
  <section class="container hidden" id="signupPage">
    <h2>Create Account</h2>

    <form id="signupForm">
      <input id="fullName" placeholder="Full Name" required>
      <input id="newUsername" placeholder="Username" required>
      <input id="gmail" type="email" placeholder="Gmail Address" required>
      <input id="newPassword" type="password"
             placeholder="Password (at least 6 characters)"
             minlength="6" required>
      <input id="confirmPassword" type="password"
             placeholder="Confirm Password" minlength="6" required>

      <button type="submit">Create Account</button>
    </form>

    <button class="secondary" onclick="showLogin()">
      Back to Login
    </button>

    <p id="signupMessage" class="message"></p>
  </section>

  <!-- OWNER PLACEHOLDER -->
  <section class="container hidden" id="ownerPage">
    <h2>Owner Option</h2>
    <p>এই অংশের কাজ তুমি পরে বুঝিয়ে দেবে।</p>
    <button class="secondary" onclick="showLogin()">
      Back to Login
    </button>
  </section>

  <!-- MEMBER HOME -->
  <section class="container hidden" id="homePage">
    <h2>Welcome!</h2>
    <p id="welcomeMessage"></p>

    <div class="panel">
      <img src="panel1.jpg" alt="Panel image">
      <h3>FF Panel</h3>
      <p>Price: ৳100</p>
      <button onclick="buyNow()">Buy Now</button>
    </div>

    <button class="secondary" onclick="logout()">Logout</button>
  </section>

  <script>
    function hideAll() {
      document.getElementById("loginPage").classList.add("hidden");
      document.getElementById("signupPage").classList.add("hidden");
      document.getElementById("ownerPage").classList.add("hidden");
      document.getElementById("homePage").classList.add("hidden");
    }

    function showLogin() {
      hideAll();
      document.getElementById("loginPage").classList.remove("hidden");
    }

    function showSignup() {
      hideAll();
      document.getElementById("signupPage").classList.remove("hidden");
    }

    function showOwner() {
      hideAll();
      document.getElementById("ownerPage").classList.remove("hidden");
    }

    function buyNow() {
      const phone = "8801XXXXXXXXX"; // এখানে তোমার WhatsApp নম্বর বসাবে
      const message = encodeURIComponent(
        "আমি FF Panel কিনতে চাই। প্যানেলের দাম ৳100।"
      );

      window.open(
        "https://wa.me/" + phone + "?text=" + message,
        "_blank"
      );
    }

    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const password = document.getElementById("newPassword").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        document.getElementById("signupMessage").textContent =
          "Password দুটি মিলছে না!";
        return;
      }

      document.getElementById("signupMessage").textContent =
        "ডেমো ফর্ম ঠিক আছে। আসল অ্যাকাউন্ট তৈরির জন্য Firebase যুক্ত করতে হবে।";
    });

    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      document.getElementById("loginMessage").textContent =
        "আসল লগইনের জন্য Firebase Authentication যুক্ত করতে হবে।";
    });

    function logout() {
      showLogin();
    }
  </script>

</body>
</html>
