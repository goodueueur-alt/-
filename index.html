  background: #131624;

  padding: 12px;
  min-width: 0;
}

.panel-image {
  height: 110px;
  display: grid;
  place-items: center;
  font-size: 42px;
  border-radius: 10px;
  background: linear-gradient(135deg, #24143d, #12303a);
}

.panel-card h3 {
  font-size: 16px;
}

  font-size: 12px;
  color: #a5a8b8;
}

  color: #c4b5fd;

  width: 100%;

  border: 0;
  border-radius: 8px;

<script>
/* লগইন সফল হলে এই ফাংশন কল করতে হবে */
function showMemberHome(user) {
  const home = document.getElementById("memberHome");

  if (!home) return;

  home.style.display = "block";

  const authOverlay = document.getElementById("authOverlay");
  if (authOverlay) {
    authOverlay.style.display = "none";
  }

  document.querySelector(".hero")
    ?.style.setProperty("display", "none");

  document.querySelector(".content-container")
    ?.style.setProperty("display", "none");
}

/* Buy Now: WhatsApp অর্ডার */
function buyPanel(panelName, price) {
  const whatsappNumber = "8801XXXXXXXXX";
  // এখানে নিজের WhatsApp নম্বর বসাবে।
  // 880 দিয়ে শুরু করবে, + বা স্পেস দেবে না।

  if (whatsappNumber.includes("X")) {
    alert("প্রথমে কোডে নিজের WhatsApp নম্বর বসাও।");
    return;
  }

  const message =
    `আমি ${panelName} কিনতে চাই। দাম: ৳${price}`;

  const url =
    "https://wa.me/" + whatsappNumber +
    "?text=" + encodeURIComponent(message);

  window.open(url, "_blank");
}

/* নিচের মেনু */
function showMemberTab(tab) {
  const message = document.getElementById("memberMessage");

  const labels = {
    home: "আপনি হোম পেজে আছেন।",
    orders: "অর্ডার হিস্ট্রি ফিচার এখনো যুক্ত করা হয়নি।",
    support: "সাপোর্টের জন্য WhatsApp-এ যোগাযোগ করুন।",
    account: "অ্যাকাউন্টের বিস্তারিত ফিচার এখনো যুক্ত করা হয়নি।"
  };

  if (message) {
    message.textContent = labels[tab] || "";
  }

  if (tab === "home") {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

/* লগআউট */
async function memberLogout() {
  if (!window.firebase || !firebase.auth) {
    alert("Firebase Authentication পাওয়া যাচ্ছে না।");
    return;
  }

  try {
    await firebase.auth().signOut();

    document.getElementById("memberHome").style.display = "none";

    document.querySelector(".hero")
      ?.style.removeProperty("display");

    document.querySelector(".content-container")
      ?.style.removeProperty("display");

    const authOverlay = document.getElementById("authOverlay");

    if (authOverlay) {
      authOverlay.style.display = "flex";
    }
  } catch (error) {
    console.error("Logout error:", error);
    alert("লগআউট করা যায়নি। আবার চেষ্টা করো।");
  }
}
</script>
