<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifat FF Panel Seller - Auth Portal</title>
  
  <!-- eSports & Professional Font Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Hind+Siliguri:wght@500;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090614;
      background-image: radial-gradient(circle at top, #1e103a 0%, #090614 75%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: 'Rajdhani', 'Hind Siliguri', sans-serif;
    }

    .auth-card {
      background: rgba(18, 12, 36, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 32px 26px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 30px rgba(139, 92, 246, 0.15);
      backdrop-filter: blur(16px);
    }

    .header-area {
      text-align: center;
      margin-bottom: 20px;
    }

    /* Custom Logo Image Container */
    .brand-logo-container {
      width: 85px;
      height: 85px;
      margin: 0 auto 12px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
      border: 2px solid rgba(234, 179, 8, 0.6);
      background: #110b27;
    }

    .brand-logo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Custom eSports Brand Font Title */
    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, #facc15 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    /* Tab Buttons for Switching (SignIn/SignUp) */
    .auth-tabs {
      display: flex;
      background: #110b27;
      border: 1px solid #332554;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #000000;
      box-shadow: 0 2px 10px rgba(234, 179, 8, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      background: #110b27;
      color: #ffffff;
      border: 1.5px solid #332554;
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: #64748b;
      font-family: 'Hind Siliguri', sans-serif;
      font-weight: 500;
    }

    input:focus {
      border-color: #eab308;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.3);
      background: #160e33;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      transition: 0.2s;
    }

    .toggle-password svg {
      width: 18px;
      height: 18px;
      fill: #cbd5e1;
    }

    .toggle-password:hover {
      opacity: 1;
    }

    .forgot-pass {
      text-align: right;
      margin-bottom: 18px;
    }

    .link {
      font-family: 'Hind Siliguri', sans-serif;
      color: #facc15;
      font-size: 12px;
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .link:hover {
      color: #fef08a;
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
      border-radius: 12px;
      color: #000000;
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      margin-top: 5px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.6);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .form-container {
      display: none;
    }

    .form-container.active {
      display: block;
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 26px 18px;
      }
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="header-area">
      <!-- আপনার গেমিং লোগো ইমেজ -->
      <div class="brand-logo-container">
        <img src="file_000000007dac82118992c526a33fae9b.png" alt="Rifat Panel Seller Logo">
      </div>

      <!-- ব্র্যান্ড নাম -->
      <h1 class="brand-title">Rifat Panel Seller</h1>
    </div>

    <!-- সাইন ইন / সাইন আপ সুইচ ট্যাব -->
    <div class="auth-tabs">
      <button class="tab-btn active" id="signInTabBtn" onclick="switchTab('signin')">সাইন ইন</button>
      <button class="tab-btn" id="signUpTabBtn" onclick="switchTab('signup')">সাইন আপ</button>
    </div>

    <!-- ১. সাইন ইন ফর্ম (Sign In Form) -->
    <div id="signinForm" class="form-container active">
      <form onsubmit="event.preventDefault(); alert('লগইন হচ্ছে...');">
        <div class="form-group">
          <label for="signin-email">ইমেল বা জিমেইল</label>
          <div class="input-wrapper">
            <input type="email" id="signin-email" placeholder="আপনার ইমেল টাইপ করুন" required />
          </div>
        </div>

        <div class="form-group">
          <label for="signin-password">পাসওয়ার্ড</label>
          <div class="input-wrapper">
            <input type="password" id="signin-password" placeholder="পাসওয়ার্ড দিন" required />
            <span class="toggle-password" onclick="togglePass('signin-password')">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <div class="forgot-pass">
          <a href="#" class="link">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <button type="submit" class="submit-btn">সাইন ইন</button>
      </form>
    </div>

    <!-- ২. সাইন আপ ফর্ম (Sign Up Form) -->
    <div id="signupForm" class="form-container">
      <form onsubmit="event.preventDefault(); alert('নতুন অ্যাকাউন্ট তৈরি হচ্ছে...');">
        <div class="form-group">
          <label for="signup-fullname">সম্পূর্ণ নাম</label>
          <div class="input-wrapper">
            <input type="text" id="signup-fullname" placeholder="আপনার পূর্ণ নাম লিখুন" required />
          </div>
        </div>

        <div class="form-group">
          <label for="signup-username">ইউজারনেম / ইন-গেম নাম</label>
          <div class="input-wrapper">
            <input type="text" id="signup-username" placeholder="আপনার গেমিং নাম" required />
          </div>
        </div>

        <div class="form-group">
          <label for="signup-email">ইমেল বা জিমেইল</label>
          <div class="input-wrapper">
            <input type="email" id="signup-email" placeholder="আপনার ইমেল টাইপ করুন" required />
          </div>
        </div>

        <div class="form-group">
          <label for="signup-phone">হোয়াটসঅ্যাপ বা ফোন নম্বর</label>
          <div class="input-wrapper">
            <input type="tel" id="signup-phone" placeholder="আপনার নম্বর দিন" required />
          </div>
        </div>

        <div class="form-group">
          <label for="signup-password">পাসওয়ার্ড</label>
          <div class="input-wrapper">
            <input type="password" id="signup-password" placeholder="পাসওয়ার্ড দিন" required />
            <span class="toggle-password" onclick="togglePass('signup-password')">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">পাসওয়ার্ড নিশ্চিত করুন</label>
          <div class="input-wrapper">
            <input type="password" id="signup-confirm-password" placeholder="পুনরায় পাসওয়ার্ড দিন" required />
            <span class="toggle-password" onclick="togglePass('signup-confirm-password')">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </span>
          </div>
        </div>

        <button type="submit" class="submit-btn">সাইন আপ</button>
      </form>
    </div>

  </div>

  <script>
    // Tab Switching Functionality
    function switchTab(type) {
      const signinForm = document.getElementById('signinForm');
      const signupForm = document.getElementById('signupForm');
      const signInTabBtn = document.getElementById('signInTabBtn');
      const signUpTabBtn = document.getElementById('signUpTabBtn');

      if (type === 'signin') {
        signinForm.classList.add('active');
        signupForm.classList.remove('active');
        signInTabBtn.classList.add('active');
        signUpTabBtn.classList.remove('active');
      } else {
        signupForm.classList.add('active');
        signinForm.classList.remove('active');
        signUpTabBtn.classList.add('active');
        signInTabBtn.classList.remove('active');
      }
    }

    // Toggle Password Visibility Function
    function togglePass(inputId) {
      const passInput = document.getElementById(inputId);
      if (passInput.type === 'password') {
        passInput.type = 'text';
      } else {
        passInput.type = 'password';
      }
    }
  </script>

</body>
</html>
